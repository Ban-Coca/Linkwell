<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkwell</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --border: #dfe7f5;
        --success: #16a34a;
        --danger: #dc2626;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        max-width: 900px;
        margin: 48px auto;
        padding: 0 20px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 2vw + 1rem, 3rem);
      }

      .subtitle {
        margin: 0 0 28px;
        color: var(--muted);
      }

      .section + .section {
        margin-top: 28px;
      }

      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      input {
        flex: 1;
        min-width: 220px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 1rem;
      }

      button {
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: white;
        padding: 12px 18px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
      }

      .error {
        margin-top: 10px;
        color: var(--danger);
        min-height: 20px;
      }

      .success-box {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #ecfdf5;
        border: 1px solid rgba(34, 197, 94, 0.25);
        display: none;
      }

      .success-box.visible {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .success-box a {
        color: var(--success);
        font-weight: 700;
      }

      .copy-btn {
        background: #0f766e;
      }

      .copy-btn:hover {
        background: #115e59;
      }

      .stats-panel {
        margin-top: 18px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #f8fafc;
        display: none;
      }

      .stats-panel.visible {
        display: block;
      }

      .stats-grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        margin-top: 16px;
      }

      .metric {
        background: white;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
      }

      .metric-label {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .metric-value {
        margin-top: 8px;
        font-size: 1.8rem;
        font-weight: 700;
      }

      ul {
        margin: 12px 0 0;
        padding-left: 18px;
      }

      li + li {
        margin-top: 8px;
      }

      .empty {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="card">
        <h1>Linkwell</h1>
        <p class="subtitle">Create a short URL and check how it performs.</p>

        <section class="section">
          <h2>Create a link</h2>
          <form id="shorten-form">
            <div class="row">
              <input id="long-url" type="url" placeholder="https://example.com/very/long/url" required />
              <button type="submit">Shorten</button>
            </div>
            <div class="error" id="create-error" aria-live="polite"></div>
          </form>

          <div class="success-box" id="success-box">
            <div>
              Your short link:
              <a id="short-link" href="#" target="_blank" rel="noreferrer"></a>
            </div>
            <button class="copy-btn" id="copy-btn" type="button">Copy</button>
          </div>
        </section>

        <section class="section">
          <h2>View stats</h2>
          <form id="stats-form">
            <div class="row">
              <input id="short-code" type="text" placeholder="Enter short code" required />
              <button type="submit">View stats</button>
            </div>
            <div class="error" id="stats-error" aria-live="polite"></div>
          </form>

          <div class="stats-panel" id="stats-panel">
            <h3>Stats for <span id="stats-code"></span></h3>
            <div class="stats-grid">
              <div class="metric">
                <div class="metric-label">Total clicks</div>
                <div class="metric-value" id="total-clicks">0</div>
              </div>
            </div>

            <div class="stats-grid">
              <div class="metric">
                <div class="metric-label">Clicks by day</div>
                <ul id="clicks-by-day"></ul>
              </div>

              <div class="metric">
                <div class="metric-label">Top referrers</div>
                <ul id="top-referrers"></ul>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script>
      const appState = {
        baseUrl: window.location.origin,
      };

      const shortenForm = document.getElementById('shorten-form');
      const createError = document.getElementById('create-error');
      const successBox = document.getElementById('success-box');
      const shortLink = document.getElementById('short-link');
      const copyBtn = document.getElementById('copy-btn');

      const statsForm = document.getElementById('stats-form');
      const statsError = document.getElementById('stats-error');
      const statsPanel = document.getElementById('stats-panel');
      const statsCode = document.getElementById('stats-code');
      const totalClicks = document.getElementById('total-clicks');
      const clicksByDay = document.getElementById('clicks-by-day');
      const topReferrers = document.getElementById('top-referrers');

      function setError(element, message) {
        element.textContent = message || '';
      }

      function clearStats() {
        statsPanel.classList.remove('visible');
        statsCode.textContent = '';
        totalClicks.textContent = '0';
        clicksByDay.innerHTML = '';
        topReferrers.innerHTML = '';
      }

      async function handleShorten(event) {
        event.preventDefault();
        setError(createError, '');

        const url = document.getElementById('long-url').value.trim();
        if (!url) {
          setError(createError, 'Please enter a URL.');
          return;
        }

        try {
          const response = await fetch('/api/links', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
          });

          if (!response.ok) {
            const message = await response.text();
            setError(createError, message || 'Invalid URL');
            return;
          }

          const data = await response.json();
          const shortUrl = `${appState.baseUrl}/${data.code}`;
          shortLink.href = shortUrl;
          shortLink.textContent = shortUrl;
          successBox.classList.add('visible');
          document.getElementById('short-code').value = data.code;
        } catch (error) {
          setError(createError, 'Could not create link.');
        }
      }

      async function handleStats(event) {
        event.preventDefault();
        setError(statsError, '');
        clearStats();

        const code = document.getElementById('short-code').value.trim();
        if (!code) {
          setError(statsError, 'Please enter a short code.');
          return;
        }

        try {
          const response = await fetch(`/api/links/${code}/stats`);
          if (!response.ok) {
            setError(statsError, 'link not found');
            return;
          }

          const stats = await response.json();
          statsPanel.classList.add('visible');
          statsCode.textContent = code;
          totalClicks.textContent = String(stats.totalClicks || 0);

          if (!stats.clicksByDay || stats.clicksByDay.length === 0) {
            clicksByDay.innerHTML = '<li class="empty">No clicks yet.</li>';
          } else {
            clicksByDay.innerHTML = stats.clicksByDay
              .map(item => `<li>${item.date}: ${item.count}</li>`)
              .join('');
          }

          if (!stats.topReferrers || stats.topReferrers.length === 0) {
            topReferrers.innerHTML = '<li class="empty">No referrers yet.</li>';
          } else {
            topReferrers.innerHTML = stats.topReferrers
              .map(item => `<li>${item.referrer}: ${item.count}</li>`)
              .join('');
          }
        } catch (error) {
          setError(statsError, 'link not found');
        }
      }

      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(shortLink.href);
          copyBtn.textContent = 'Copied!';
          setTimeout(() => {
            copyBtn.textContent = 'Copy';
          }, 1200);
        } catch (error) {
          copyBtn.textContent = 'Copy failed';
        }
      });

      shortenForm.addEventListener('submit', handleShorten);
      statsForm.addEventListener('submit', handleStats);
    </script>
  </body>
</html>
