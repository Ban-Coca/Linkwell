name: building linkwell

on: 
  push:
    branches:
      - main
  pull_request:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build -o linkwell .
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = windows]; then
            ext=".exe"
          fi
          go build -o "dist/linkwell-${GOOS}-${GOARCH}${ext}" .
      - name: Checksum
        run: | 
          cd dist
          sha256sum * > checksum.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linkwell-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/